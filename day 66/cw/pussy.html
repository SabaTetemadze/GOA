<body>
  <script>
    let num = 100
    if(num%2==0){
      console.log('even')
    } else{
      console.log('odd')
    }

    if(num%3==0 || num%5==0){
      console.log('ეს რიცხვი არის 3 ის და 5 ის ჯერადი')
    } else{
      console.log('ეს რიცხვი არ არის არც სამის და არც ხუთის ჯერადი')
    }
    /*
    > - მეტია 12>3 true
    < - ნაკლებია 12<100 true
    >= - მეტია ან ტოლი 12>=12 true
    <= - ნაკლებია ან ტოლი 14<=13 false
    == - უდრის  5 == '5'  true
    === - მკაცრი ტოლობა 5===5 true    5==='5' false
    != - უტოლობა 3!=5 true

    falsy - "", '', 0
    truthy - true, 1, "hello"
    */
  </script>
</body>
