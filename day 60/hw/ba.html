<!-- 
transition - ცვლის თუ რამდენი დრო დაჭირდება მის ანიმაციას, როდესაც შეიცლება მაგ hover-ით
transition-delay რამდენ ხანში დაიწყება ანიმაცია

transition:width 3s, height 4s, scale 5s ; დააშორე მძიმეებით
-->
<html>
    <head>
        <style>
            #one{
            height: 100px;
            width: 100px;
            background-color: black;
            transition: all 2s;
            transition-delay: 1s, background-color 0s;
            &:hover{
                transform: translate(100px,100px);
                background-color: green;
            }
            }

        </style>
    </head>
    <body>

        <div id="one"></div>

    </body>
</html>
