<html>
  <head>
    <style>
      body{
        background-color: gray;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #all{
        height: 667px;
        width: 500px;
        display: grid;
        padding: 8px;
        background-color: white;
        grid-template-rows: repeat(12,1fr);
        grid-template-columns: repeat(6,1fr);
      }
      .indiv{
        border: solid black 1px;
        height: auto;
        width: auto;
        margin: 3px;
      }
      #one{
        grid-area: 1/1/1/4;
      }
      #two{
        grid-area: 1/4/1/7;
      }
      #tre{
        grid-area: 2/1/5/3;
      }
      #for{
        grid-area: 2/3/5/5;
      }
      #fiv{
        grid-area: 2/5/6/7;
      }
      #six{
        grid-area: 5/1/6/5;
      }
      #sev{
        grid-area: 6/1/9/5;
      }
      #eig{
        grid-area: 6/5/9/7;
      }
      #nin{
        grid-area: 9/1/12/3;
      }
      #ten{
        grid-area: 9/3/12/5;
      }
      #ele{
        grid-area: 9/5/12/7;
      }
      #twe{
        grid-area: 12/1/13/4;
      }
      h2{
        grid-column: 4/7;
      }
    </style>
  </head>
  <body>
    <div id="all">
      <div class="indiv" id="one"><p></p></div>
      <div class="indiv" id="two"><p></p></div>
      <div class="indiv" id="tre"><p></p></div>
      <div class="indiv" id="for"><p></p></div>
      <div class="indiv" id="fiv"><p></p></div>
      <div class="indiv" id="six"><p></p></div>
      <div class="indiv" id="sev"><p></p></div>
      <div class="indiv" id="eig"><p></p></div>
      <div class="indiv" id="nin"><p></p></div>
      <div class="indiv" id="ten"><p></p></div>
      <div class="indiv" id="ele"><p></p></div>
      <div class="indiv" id="twe"><p></p></div>
      <h2>Name...............................</h2>
    </div>
  </body>
</html>
